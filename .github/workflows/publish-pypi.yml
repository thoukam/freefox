name: Publish to PyPI

# Runs when a GitHub release is published (e.g. tag v0.2.1).
# Uses PyPI Trusted Publishing: no API token is stored in GitHub.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('freefox/__init__.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package version: $VERSION, release tag: $TAG"
          test "$VERSION" = "$TAG"

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/freefox/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
