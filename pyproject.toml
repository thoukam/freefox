[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freefox"
dynamic = ["version"]
description = "Reliable, resumable upload of ROS 2 bags from robots to Google Drive, rsync/NAS and S3-compatible storage"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

keywords = ["ros2", "rosbag", "mcap", "robotics", "data-collection", "google-drive", "s3", "minio", "rsync", "upload", "fleet"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Robotics",
    "Topic :: System :: Archiving :: Backup",
]

authors = [
  { name = "Yves Thoukam", email = "thoukamy@gmail.com" },
]

maintainers = [
  { name = "Yves Thoukam", email = "thoukamy@gmail.com" },
]

dependencies = [
    "blake3>=0.4",
    "pyyaml>=6.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
    "watchdog>=3.0",
]

[project.urls]
Homepage = "https://thoukam.github.io/freefox/"
Repository = "https://github.com/thoukam/freefox"
Issues = "https://github.com/thoukam/freefox/issues"
Changelog = "https://github.com/thoukam/freefox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.1",
    "ruff>=0.6",
    "build>=1.0",
    "twine>=5.0",
]
s3 = [
    "boto3>=1.28",
]

[project.scripts]
freefox = "freefox.service:main"
freefox-dashboard = "freefox.dashboard:main"
freefox-status = "freefox.status:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["freefox*"]

[tool.setuptools.package-data]
freefox = ["assets/*.png", "assets/*.html"]

[tool.setuptools.dynamic]
version = { attr = "freefox.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
